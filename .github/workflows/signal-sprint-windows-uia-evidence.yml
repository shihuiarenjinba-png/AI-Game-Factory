            schema='signal-sprint-uia-hash-binding-v2'
            status='PASS_HASH_BOUND_INDEPENDENT_BUILD_AND_PHYSICAL_UIA'
            attested_build_run_id=$preflight.attested_build_run_id
            attested_build_artifact_id=$preflight.attested_build_artifact_id
            attested_build_exe_sha256=$preflight.attested_build_exe_sha256
            attested_build_workflow_head_sha=$preflight.attested_build_workflow_head_sha
            exe_sha256=([string]$preflight.exe_sha256).ToLowerInvariant()
            exe_size_bytes=$build.exe_size_bytes
            artifact_exe_size_bytes=$build.artifact_exe_size_bytes
            artifact_zip_sha256=$build.artifact_zip_sha256
            artifact_zip_size_bytes=$build.artifact_zip_size_bytes
            build_run_url=$build.build_run_url
            build_receipt_sha256=$preflight.build_receipt_sha256
            product_source=$preflight.product_source
            workflow_head=$preflight.workflow_head
            independent_build_verified=$true
            independent_build_run_id=$build.run_id
            independent_build_artifact_id=$build.artifact_id
            independent_build_workflow_head_sha=$build.workflow_head_sha
            physical_gui_receipt_status=$uia.status
          } | ConvertTo-Json | Set-Content -LiteralPath evidence/uia-hash-binding.json -Encoding utf8
