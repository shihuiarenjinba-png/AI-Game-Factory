name: Signal Sprint Windows UIA evidence (GDK only)
on:
  push:
    branches:
      - codex/signal-sprint-uia-fixture-20261110
      - codex/signal-sprint-cloud-build-proof-20261123
    paths:
      - 'qa/signal_sprint_cloud_provenance_fixture.py'
      - 'qa/signal_sprint_independent_build_verify.py'
      - 'qa/signal_sprint_uia_dynamic_gate.ps1'
      - 'qa/signal_sprint_gdk_sdk_capability_probe.py'
      - 'products/signal-sprint/tests/test_gdk_sdk_capability_probe.py'
      - 'qa/signal_sprint_gdk_package_readiness.py'
      - 'products/signal-sprint/tests/test_gdk_package_readiness.py'
      - '.github/workflows/signal-sprint-windows-uia-evidence.yml'
      - '.github/workflows/signal-sprint-cloud-build-proof.yml'
  workflow_dispatch:
    inputs:
      expected_head:
        description: Exact 40-character workflow branch commit SHA to attest before checkout
        required: true
        type: string
      run_physical_uia:
        description: Request physical GDK Windows UIA only when every cloud and revision gate passes
        required: false
        default: false
        type: boolean
      exe_path:
        description: Absolute path to independently built Signal Sprint EXE on interactive Windows runner
        required: false
        type: string
      exe_sha256:
        description: Independently attested SHA256 of EXE
        required: false
        type: string
      build_receipt_path:
        description: Absolute path to independently produced JSON build receipt (source_commit, exe_sha256, build_run_url)
        required: false
        type: string
permissions:
  contents: read
  actions: read
jobs:
  cloud-provenance-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Assert exact-head cloud checkout
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          DISPATCH_EXPECTED_HEAD: ${{ inputs.expected_head }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD" || { echo 'CLOUD_EXACT_HEAD_MISMATCH'; exit 1; }
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            [[ "$DISPATCH_EXPECTED_HEAD" =~ ^[a-f0-9]{40}$ ]] || { echo 'DISPATCH_EXPECTED_HEAD_INVALID'; exit 1; }
            test "$DISPATCH_EXPECTED_HEAD" = "$EXPECTED_HEAD" || { echo 'DISPATCH_EXPECTED_HEAD_MISMATCH'; exit 1; }
          fi
      - name: Run synthetic provenance and JA/EN static contract checks
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          ACTIONS_RUN_ID: ${{ github.run_id }}
        run: python3 qa/signal_sprint_cloud_provenance_fixture.py
      - name: Upload cloud fixture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signal-sprint-cloud-provenance-fixture
          path: evidence/cloud-provenance-fixture.json
          if-no-files-found: error
          retention-days: 30
  cloud-revision-hold:
    outputs:
      revision_included: ${{ steps.preflight.outputs.revision_included }}
      preflight_status: ${{ steps.preflight.outputs.preflight_status }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Record frozen source revision inclusion before physical UIA
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path
          source = '1a349faa41663c417c40710140a4d50c79b62b78'
          revision = '9ccd7ff4389b3ca0e45c8407d7369a00f4302cf2'
          def git(*args):
              return subprocess.run(['git', *args], capture_output=True, text=True)
          source_exists = git('cat-file', '-e', source + '^{commit}').returncode == 0
          revision_exists = git('cat-file', '-e', revision + '^{commit}').returncode == 0
          included = source_exists and revision_exists and git('merge-base', '--is-ancestor', revision, source).returncode == 0
          result = {
              'schema': 'signal-sprint-cloud-revision-preflight-v1',
              'product_source': source,
              'required_revision': revision,
              'source_exists': source_exists,
              'revision_exists': revision_exists,
              'revision_included': included,
              'status': 'PASS_REVISION_INCLUDED' if included else 'HOLD_REVISION_NOT_IN_FROZEN_SOURCE',
              'physical_gui_verified': False,
              'independent_build_verified': False,
              'product_acceptance': False,
          }
          Path('evidence/cloud-revision-preflight.json').write_text(json.dumps(result, indent=2) + '\n', encoding='utf-8')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('revision_included=' + ('true' if included else 'false') + '\n')
              output.write('preflight_status=' + result['status'] + '\n')
          if not source_exists or not revision_exists:
              raise SystemExit('MISSING_REQUIRED_GIT_OBJECT')
          if included:
              print('REVISION_INCLUDED: physical UIA may proceed only on explicit exact-head dispatch')
          else:
              print('EXPECTED_PRODUCT_HOLD: frozen source lacks required WIN/LOSE revision; GUI not attested')
          PY
      - name: Upload independent revision preflight
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signal-sprint-cloud-revision-preflight
          path: evidence/cloud-revision-preflight.json
          if-no-files-found: error
          retention-days: 30
  completed-build-attestation:
    needs: [cloud-provenance-fixture]
    outputs:
      attestation_status: ${{ steps.publish.outputs.attestation_status }}
      build_run_id: ${{ steps.publish.outputs.build_run_id }}
      build_artifact_id: ${{ steps.publish.outputs.build_artifact_id }}
      build_exe_sha256: ${{ steps.publish.outputs.build_exe_sha256 }}
      build_workflow_head_sha: ${{ steps.publish.outputs.build_workflow_head_sha }}
    if: >-
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.expected_head == github.sha)) &&
      needs.cloud-provenance-fixture.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact UIA workflow head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Initialize completed-build evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          cat > evidence/completed-build-attestation.json <<'JSON'
          {
            "schema": "signal-sprint-completed-build-attestation-v1",
            "status": "HOLD_BUILD_RUN_NOT_COMPLETED",
            "workflow_head_sha": "${{ github.sha }}",
            "independent_build_verified": false,
            "physical_gui_verified": false,
            "gdk_package_verified": false,
            "msix_status": "NOT_BUILT"
          }
          JSON
      - name: Find exact-head completed cloud build run
        id: discover
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import time
          import urllib.parse
          import urllib.request
          from pathlib import Path

          repo = "shihuiarenjinba-png/AI-Game-Factory"
          expected_head = os.environ.get("EXPECTED_HEAD", "")
          token = os.environ.get("GITHUB_TOKEN", "")
          api = "https://api.github.com/repos/" + repo + "/actions/workflows/427222317/runs"
          output = os.environ["GITHUB_OUTPUT"]
          if not re.fullmatch(r"[a-f0-9]{40}", expected_head):
              raise SystemExit("EXPECTED_HEAD_INVALID")
          if not token:
              raise SystemExit("GITHUB_TOKEN_MISSING")

          last_error = None
          latest_status = None
          latest_run_id = None
          for attempt in range(60):
              query = urllib.parse.urlencode({
                  "head_sha": expected_head,
                  "event": "push",
                  "per_page": 20,
              })
              request = urllib.request.Request(
                  api + "?" + query,
                  headers={
                      "Authorization": "Bearer " + token,
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "signal-sprint-completed-build-attestation",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      payload = json.loads(response.read(2 * 1024 * 1024 + 1))
                  runs = payload.get("workflow_runs")
                  if not isinstance(runs, list):
                      raise ValueError("WORKFLOW_RUNS_INVALID")
                  candidates = [
                      run for run in runs
                      if isinstance(run, dict)
                      and run.get("head_sha") == expected_head
                      and run.get("path") == ".github/workflows/signal-sprint-cloud-build-proof.yml"
                      and run.get("event") == "push"
                      and run.get("repository", {}).get("full_name") == repo
                      and type(run.get("id")) is int and run["id"] > 0
                  ]
                  candidates.sort(
                      key=lambda run: (
                          int(run.get("run_number") or 0),
                          int(run.get("run_attempt") or 0),
                          int(run.get("id") or 0),
                      ),
                      reverse=True,
                  )
                  if candidates:
                      run = candidates[0]
                      latest_status = run.get("status")
                      latest_run_id = run.get("id")
                      if latest_status == "completed":
                          if run.get("conclusion") != "success":
                              discovery = {
                                  "schema": "signal-sprint-build-run-discovery-v1",
                                  "status": "FAIL_BUILD_RUN_NOT_SUCCESS",
                                  "workflow_head_sha": expected_head,
                                  "build_run_id": latest_run_id,
                                  "run_status": latest_status,
                                  "run_conclusion": run.get("conclusion"),
                              }
                              Path("evidence/build-run-discovery.json").write_text(
                                  json.dumps(discovery, indent=2) + "\n", encoding="utf-8"
                              )
                              with open(output, "a", encoding="utf-8") as handle:
                                  handle.write(f"build_run_id={latest_run_id}\n")
                              raise SystemExit("BUILD_RUN_COMPLETED_NOT_SUCCESS")
                          discovery = {
                              "schema": "signal-sprint-build-run-discovery-v1",
                              "status": "PASS_COMPLETED_BUILD_RUN_DISCOVERED",
                              "workflow_head_sha": expected_head,
                              "build_run_id": latest_run_id,
                              "run_status": latest_status,
                              "run_conclusion": run.get("conclusion"),
                              "run_attempt": run.get("run_attempt"),
                              "run_url": run.get("html_url"),
                          }
                          Path("evidence/build-run-discovery.json").write_text(
                              json.dumps(discovery, indent=2) + "\n", encoding="utf-8"
                          )
                          with open(output, "a", encoding="utf-8") as handle:
                              handle.write(f"build_run_id={latest_run_id}\n")
                          break
              except SystemExit:
                  raise
              except Exception as exc:
                  last_error = type(exc).__name__ + ":" + str(exc)[:180]
              if attempt < 59:
                  time.sleep(10)
          else:
              hold_status = "HOLD_ACTIONS_API_UNAVAILABLE" if last_error else "HOLD_BUILD_RUN_NOT_COMPLETED"
              hold = {
                  "schema": "signal-sprint-completed-build-attestation-v1",
                  "status": hold_status,
                  "failure_reason": last_error or "NO_COMPLETED_EXACT_HEAD_BUILD_RUN_WITHIN_WAIT_WINDOW",
                  "workflow_head_sha": expected_head,
                  "build_run_id": latest_run_id,
                  "last_observed_run_status": latest_status,
                  "independent_build_verified": False,
                  "physical_gui_verified": False,
                  "gdk_package_verified": False,
                  "msix_status": "NOT_BUILT",
              }
              Path("evidence/completed-build-attestation.json").write_text(
                  json.dumps(hold, indent=2) + "\n", encoding="utf-8"
              )
              Path("evidence/build-run-discovery.json").write_text(
                  json.dumps({
                      "schema": "signal-sprint-build-run-discovery-v1",
                      "status": hold_status,
                      "workflow_head_sha": expected_head,
                      "build_run_id": latest_run_id,
                      "last_observed_run_status": latest_status,
                      "failure_reason": last_error or "NO_COMPLETED_EXACT_HEAD_BUILD_RUN_WITHIN_WAIT_WINDOW",
                  }, indent=2) + "\n",
                  encoding="utf-8",
              )
              with open(output, "a", encoding="utf-8") as handle:
                  handle.write("build_run_id=\n")
              print(hold_status)
          PY
      - name: Download independent build receipt from the exact run
        id: download_proof
        if: steps.discover.outputs.build_run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: signal-sprint-independent-cloud-build-proof
          path: evidence/build-proof
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.discover.outputs.build_run_id }}
      - name: Validate receipt run and workflow head; expose exact EXE artifact ID
        id: receipt
        if: steps.download_proof.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          EXPECTED_BUILD_RUN_ID: ${{ steps.discover.outputs.build_run_id }}
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          receipt = json.loads(
              Path("evidence/build-proof/build-receipt.json").read_text(encoding="utf-8")
          )
          expected_run = os.environ.get("EXPECTED_BUILD_RUN_ID", "")
          expected_head = os.environ.get("EXPECTED_HEAD", "")
          if not re.fullmatch(r"[1-9][0-9]*", expected_run):
              raise SystemExit("EXPECTED_BUILD_RUN_ID_INVALID")
          if not re.fullmatch(r"[a-f0-9]{40}", expected_head):
              raise SystemExit("EXPECTED_HEAD_INVALID")
          match = re.fullmatch(
              r"https://github\.com/shihuiarenjinba-png/AI-Game-Factory/actions/runs/([1-9][0-9]*)",
              str(receipt.get("build_run_url", "")),
          )
          if not match or match.group(1) != expected_run:
              raise SystemExit("BUILD_RUN_ID_RECEIPT_MISMATCH")
          if receipt.get("workflow_head_sha") != expected_head:
              raise SystemExit("BUILD_WORKFLOW_HEAD_NOT_EXACT_UIA_HEAD")
          if receipt.get("source_commit") != "1a349faa41663c417c40710140a4d50c79b62b78":
              raise SystemExit("BUILD_RECEIPT_PRODUCT_SOURCE_MISMATCH")
          if receipt.get("pr30_source_commit") != "a377043d3c9ab0c71d9a100cdb841dd7000313b9":
              raise SystemExit("BUILD_RECEIPT_PR30_SOURCE_MISMATCH")
          artifact_id = receipt.get("artifact_id")
          if type(artifact_id) is not int or artifact_id <= 0:
              raise SystemExit("BUILD_ARTIFACT_ID_INVALID")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"artifact_id={artifact_id}\n")
          PY
      - name: Download EXE artifact by the receipt's exact artifact ID
        id: download_exe
        if: steps.receipt.outcome == 'success'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.receipt.outputs.artifact_id }}
          path: evidence/frozen-source-exe
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.discover.outputs.build_run_id }}
      - name: Independently verify completed run, build job, artifact digest and EXE SHA
        id: verify
        if: always() && steps.discover.outputs.build_run_id != ''
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_BUILD_RUN_ID: ${{ steps.discover.outputs.build_run_id }}
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 qa/signal_sprint_independent_build_verify.py \
            --receipt evidence/build-proof/build-receipt.json \
            --exe evidence/frozen-source-exe/SignalSprint.exe \
            --output evidence/completed-build-attestation.json \
            --require-completed-run \
            --expected-run-id "$EXPECTED_BUILD_RUN_ID" \
            --expected-workflow-head "$EXPECTED_HEAD"
      - name: Publish completed build attestation status and exact build bindings
        id: publish
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          path = Path("evidence/completed-build-attestation.json")
          receipt = {}
          outputs = {}
          if path.is_file():
              try:
                  receipt = json.loads(path.read_text(encoding="utf-8"))
                  status = str(receipt.get("status") or "HOLD_ATTESTATION_STATUS_MISSING")
              except (ValueError, OSError):
                  status = "FAIL_ATTESTATION_RECEIPT_INVALID"
          else:
              status = "HOLD_ATTESTATION_RECEIPT_MISSING"

          if status == "PASS_INDEPENDENT_BUILD_ONLY":
              valid = (
                  receipt.get("completed_run_required") is True
                  and receipt.get("run_status_at_verification") == "completed"
                  and receipt.get("run_conclusion") == "success"
                  and receipt.get("independent_build_verified") is True
                  and receipt.get("build_provenance_verified") is True
                  and receipt.get("workflow_head_sha") == os.environ.get("GITHUB_SHA")
                  and receipt.get("product_source") == "1a349faa41663c417c40710140a4d50c79b62b78"
                  and receipt.get("pr30_source_commit") == "a377043d3c9ab0c71d9a100cdb841dd7000313b9"
                  and type(receipt.get("run_id")) is int and receipt["run_id"] > 0
                  and type(receipt.get("artifact_id")) is int and receipt["artifact_id"] > 0
                  and isinstance(receipt.get("exe_sha256"), str)
                  and bool(re.fullmatch(r"[0-9a-f]{64}", receipt["exe_sha256"]))
              )
              if not valid:
                  status = "HOLD_COMPLETED_BUILD_ATTESTATION_FIELDS_INVALID"
              else:
                  outputs = {
                      "build_run_id": str(receipt["run_id"]),
                      "build_artifact_id": str(receipt["artifact_id"]),
                      "build_exe_sha256": receipt["exe_sha256"],
                      "build_workflow_head_sha": receipt["workflow_head_sha"],
                  }

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("attestation_status=" + status + "\n")
              for key, value in outputs.items():
                  output.write(key + "=" + value + "\n")
          print(status)
          PY
      - name: Upload completed build attestation and source receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signal-sprint-completed-build-attestation
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
      - name: Fail closed on a completed-run or provenance mismatch
        if: always() && (steps.discover.outcome == 'failure' || (steps.discover.outputs.build_run_id != '' && steps.verify.outcome != 'success'))
        shell: bash
        run: |
          echo 'COMPLETED_BUILD_ATTESTATION_FAILED'
          exit 1

  bilingual-uia:
    needs: [cloud-provenance-fixture, cloud-revision-hold, completed-build-attestation]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.run_physical_uia == true &&
      github.ref == 'refs/heads/codex/signal-sprint-cloud-build-proof-20261123' &&
      inputs.expected_head == github.sha &&
      inputs.exe_path != '' &&
      inputs.exe_sha256 != '' &&
      inputs.build_receipt_path != '' &&
      needs.cloud-provenance-fixture.result == 'success' &&
      needs.completed-build-attestation.outputs.attestation_status == 'PASS_INDEPENDENT_BUILD_ONLY' &&
      needs.cloud-revision-hold.outputs.revision_included == 'true'
    runs-on: [self-hosted, Windows, interactive-desktop, signal-sprint-gdk]
    env:
      ATTESTED_BUILD_RUN_ID: ${{ needs.completed-build-attestation.outputs.build_run_id }}
      ATTESTED_BUILD_ARTIFACT_ID: ${{ needs.completed-build-attestation.outputs.build_artifact_id }}
      ATTESTED_BUILD_EXE_SHA256: ${{ needs.completed-build-attestation.outputs.build_exe_sha256 }}
      ATTESTED_BUILD_WORKFLOW_HEAD_SHA: ${{ needs.completed-build-attestation.outputs.build_workflow_head_sha }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_head }}
          persist-credentials: false
          fetch-depth: 0
      - name: Preflight exact checkout and EXE provenance
        shell: pwsh
        env:
          EXE_PATH: ${{ inputs.exe_path }}
          EXPECTED_HEAD: ${{ inputs.expected_head }}
          DISPATCH_HEAD: ${{ github.sha }}
          EXPECTED_EXE_SHA256: ${{ inputs.exe_sha256 }}
          BUILD_RECEIPT_PATH: ${{ inputs.build_receipt_path }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path evidence | Out-Null
          # Emit a machine-readable failure receipt even if preflight aborts early.
          trap {
            $failure = [pscustomobject]@{
              schema = 'signal-sprint-preflight-v2'
              status = 'FAIL'
              error = [string]$_.Exception.Message
              provenance = 'NOT_INDEPENDENTLY_VERIFIED'
              gui = 'NOT_TESTED'
            }
            $failure | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath evidence/preflight-receipt.json -Encoding utf8
            Write-Error ('PREFLIGHT_FAILED: ' + [string]$_.Exception.Message) -ErrorAction Continue
            exit 1
          }
          $head = (git rev-parse HEAD).Trim()
          $expectedHead = [string]$env:EXPECTED_HEAD
          if ($expectedHead -cnotmatch '^[a-f0-9]{40}$') { throw 'EXPECTED_HEAD_INVALID' }
          if ($env:DISPATCH_HEAD -cne $expectedHead) { throw 'DISPATCH_HEAD_MISMATCH' }
          $productSource = '1a349faa41663c417c40710140a4d50c79b62b78'
          $pr30 = 'a377043d3c9ab0c71d9a100cdb841dd7000313b9'
          if ($head -cne $expectedHead) { throw "CHECKOUT_HEAD_MISMATCH: $head" }
          git merge-base --is-ancestor $pr30 $productSource
          if ($LASTEXITCODE -ne 0) { throw 'PR30_SOURCE_ANCESTRY_MISMATCH' }
          git merge-base --is-ancestor $productSource $head
          if ($LASTEXITCODE -ne 0) { throw 'PRODUCT_SOURCE_NOT_IN_UIA_HEAD' }
          # Fail closed before launching the physical GUI or trusting any executable.
          # Keep this physical-run receipt distinct from the cloud static fixture.
          $requiredRevision = '9ccd7ff4389b3ca0e45c8407d7369a00f4302cf2'
          git cat-file -e "$requiredRevision^{commit}"
          if ($LASTEXITCODE -ne 0) { throw 'REQUIRED_WIN_LOSE_REVISION_NOT_FOUND' }
          git merge-base --is-ancestor $requiredRevision $productSource
          $revisionIncluded = ($LASTEXITCODE -eq 0)
          [pscustomobject]@{
            schema='signal-sprint-physical-revision-preflight-v1'
            product_source=$productSource
            required_revision=$requiredRevision
            revision_included=$revisionIncluded
            status=$(if ($revisionIncluded) { 'PASS_REVISION_INCLUDED' } else { 'HOLD_REVISION_NOT_IN_FROZEN_SOURCE' })
            physical_gui_verified=$false
            independent_build_verified=$false
            product_acceptance=$false
          } | ConvertTo-Json | Set-Content -LiteralPath evidence/physical-revision-preflight.json -Encoding utf8
          if (-not $revisionIncluded) { throw 'PHYSICAL_PREFLIGHT_REVISION_NOT_IN_FROZEN_SOURCE' }
          if (-not [Environment]::UserInteractive) { throw 'INTERACTIVE_DESKTOP_REQUIRED' }
          if (-not [IO.Path]::IsPathFullyQualified($env:EXE_PATH) -or -not (Test-Path -LiteralPath $env:EXE_PATH -PathType Leaf)) { throw 'EXE_MISSING_OR_NOT_ABSOLUTE' }
          if ($env:EXPECTED_EXE_SHA256 -notmatch '^[a-fA-F0-9]{64}$') { throw 'INVALID_EXPECTED_EXE_SHA256' }
          $actual = (Get-FileHash -LiteralPath $env:EXE_PATH -Algorithm SHA256).Hash
          if ($actual -ine $env:EXPECTED_EXE_SHA256) { throw 'EXE_SHA256_MISMATCH' }
