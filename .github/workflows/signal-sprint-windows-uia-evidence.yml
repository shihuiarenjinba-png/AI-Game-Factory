          if ($buildArtifactId -le 0) { throw 'BUILD_ARTIFACT_ID_INVALID' }
          $attestedRunIdText = [string]$env:ATTESTED_BUILD_RUN_ID
          $attestedArtifactIdText = [string]$env:ATTESTED_BUILD_ARTIFACT_ID
          $attestedExeSha = [string]$env:ATTESTED_BUILD_EXE_SHA256
          $attestedWorkflowHead = [string]$env:ATTESTED_BUILD_WORKFLOW_HEAD_SHA
          if ($attestedRunIdText -cnotmatch '^[1-9][0-9]*          if ($exeSize -le 0) { throw 'EXE_SIZE_INVALID' }
          [pscustomobject]@{
            workflow_head=$head
            product_source=$productSource
            pr30_source=$pr30
            exe_sha256=$actual
            exe_size_bytes=$exeSize
            build_receipt_sha256=$receiptFileSha
            attested_build_run_id=$attestedRunId
            attested_build_artifact_id=$attestedArtifactId
            attested_build_exe_sha256=$attestedExeSha.ToLowerInvariant()
            attested_build_workflow_head_sha=$attestedWorkflowHead
