            }
            $lostToken = if ($lang -ceq 'EN') { 'ControlType.Text:LOST' } else { 'ControlType.Text:失敗' }
            $lostCases = @($cases | Where-Object {
              @($_.lost_uia_nodes | Where-Object { [string]$_ -ceq $lostToken }).Count -gt 0
            })
            if ($lostCases.Count -eq 0) { throw "UIA_LOCALIZED_LOST_NOT_OBSERVED:$lang" }
            $loadName = if ($lang -ceq 'EN') { 'Load (L)' } else { '読込 (L)' }
            $loadCases = @($cases | Where-Object { $_.name -ceq $loadName })
            if ($loadCases.Count -ne 1) { throw "UIA_LOAD_CASE_NOT_UNIQUE:$lang" }
            $loadLostNodes = @($loadCases[0].lost_uia_nodes | Where-Object { [string]$_ -ceq $lostToken })
            if ($loadLostNodes.Count -eq 0) { throw "UIA_LOAD_LOST_STATE_NOT_OBSERVED:$lang" }
            $startName = if ($lang -ceq 'EN') { 'Start / Retry (R)' } else { '開始 / 再挑戦 (R)' }
            $startCases = @($cases | Where-Object { $_.name -ceq $startName })
            if ($startCases.Count -ne 1) { throw "UIA_START_CASE_NOT_UNIQUE:$lang" }
            $startLostBefore = @($startCases[0].uia_before | Where-Object { [string]$_ -ceq $lostToken })
            $playingToken = if ($lang -ceq 'EN') { 'ControlType.Text:PLAYING' } else { 'ControlType.Text:プレイ中' }
            $startPlayingAfter = @($startCases[0].uia_after | Where-Object { [string]$_ -ceq $playingToken })
            $startLostAfter = @($startCases[0].uia_after | Where-Object { [string]$_ -ceq $lostToken })
            if ($startLostBefore.Count -eq 0) { throw "UIA_START_LOST_PRECONDITION_NOT_OBSERVED:$lang" }
            if ($startPlayingAfter.Count -eq 0 -or $startLostAfter.Count -gt 0) {
              throw "UIA_START_LOST_TO_PLAYING_TRANSITION_NOT_OBSERVED:$lang"
            }
          }
