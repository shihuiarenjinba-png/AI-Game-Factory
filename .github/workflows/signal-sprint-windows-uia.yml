name: Signal Sprint Windows UIA dynamic gate
on:
  workflow_dispatch:
    inputs:
      exe_path:
        description: 'Absolute path to prebuilt Signal Sprint EXE on the interactive Windows runner'
        required: true
        type: string
      exe_sha256:
        description: 'Expected SHA256 of the executable (64 hex characters)'
        required: true
        type: string
permissions:
  contents: read
jobs:
  signal-sprint-uia:
    # A GitHub-hosted Windows runner is not an unlocked interactive desktop.
    runs-on: [self-hosted, Windows, signal-sprint-interactive]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify immutable product base and executable
        shell: pwsh
        env:
          EXE_PATH: ${{ inputs.exe_path }}
          EXE_SHA256: ${{ inputs.exe_sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          git cat-file -e '1a349faa41663c417c40710140a4d50c79b62b78^{commit}'
          if ($LASTEXITCODE -ne 0) { throw 'SOURCE_HEAD_NOT_FOUND' }
          git merge-base --is-ancestor 1a349faa41663c417c40710140a4d50c79b62b78 HEAD
          if ($LASTEXITCODE -ne 0) { throw 'SOURCE_HEAD_NOT_ANCESTOR' }
          if ($env:EXE_SHA256 -notmatch '^[0-9a-fA-F]{64}$') { throw 'EXPECTED_EXE_SHA_INVALID' }
          if (!(Test-Path -LiteralPath $env:EXE_PATH -PathType Leaf)) { throw 'EXE_NOT_FOUND' }
          $actual = (Get-FileHash -LiteralPath $env:EXE_PATH -Algorithm SHA256).Hash
          if ($actual -ine $env:EXE_SHA256) { throw 'EXE_SHA_MISMATCH' }
          if (-not [Environment]::UserInteractive) { throw 'NO_INTERACTIVE_DESKTOP' }
      - name: Measure real UIA Invoke Focus and LOST
        shell: pwsh
        env:
          EXE_PATH: ${{ inputs.exe_path }}
        run: |
          New-Item -ItemType Directory -Force -Path evidence | Out-Null
          & ./qa/signal_sprint_uia_dynamic_gate.ps1 -ExePath $env:EXE_PATH -OutputPath evidence/signal-sprint-dynamic-uia.json
          if ($LASTEXITCODE -ne 0) { throw "UIA_GATE_FAILED_EXIT_$LASTEXITCODE" }
      - name: Upload receipt even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signal-sprint-windows-uia-receipt
          path: evidence/
          if-no-files-found: warn
